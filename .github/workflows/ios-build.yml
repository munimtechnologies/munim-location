name: Build iOS

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-build.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'example/ios/**'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'example/*.tsx'
      - 'example/src/**'
      - 'example/package.json'
      - 'cpp/**'
      - 'ios/**'
      - '**/Podfile.lock'
      - '**/bun.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'example/ios/**'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'example/*.tsx'
      - 'example/src/**'
      - 'example/package.json'
      - 'cpp/**'
      - 'ios/**'
      - '**/Podfile.lock'
      - '**/bun.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  workflow_dispatch:

env:
  USE_CCACHE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App (Xcode ${{ matrix.xcode }}, ${{ matrix.configuration }} ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift 6.2/6.3: the iOS 27 code paths must compile out.
          - runner: macos-26
            xcode: '26.6'
            configuration: Debug
            platform: iOS Simulator
          # Swift 6.4 + iOS 27 SDK: iOS 27 symbols (maritime activity) compile in.
          - runner: xcode-27
            xcode: '27.0'
            configuration: Debug
            platform: iOS Simulator
          # Release device builds link against the Release prebuilt React Native
          # frameworks, which Debug simulator builds never touch.
          - runner: macos-26
            xcode: '26.6'
            configuration: Release
            platform: iOS
          - runner: xcode-27
            xcode: '27.0'
            configuration: Release
            platform: iOS
    steps:
      - uses: actions/checkout@v7
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example/ios

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods/repos
            example/ios/Pods
          # node_modules podspecs (React Native, Nitro) change with package-lock.json
          # while Podfile.lock may lag, so both are part of the key; no prefix
          # fallback, because stale Pods/Local Podspecs make `pod install` fail.
          # Per configuration: the build swaps the prebuilt RN frameworks inside Pods/.
          key: ${{ runner.os }}-xcode${{ matrix.xcode }}-${{ matrix.configuration }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'package-lock.json', '*.podspec') }}

      - name: Install Pods
        working-directory: example/ios
        run: |
          pod install
          # Shows what a committed Podfile.lock is missing.
          git --no-pager diff -- Podfile.lock || true

      - name: Build App
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace MunimLocationExample.xcworkspace \
            -scheme MunimLocationExample \
            -configuration '${{ matrix.configuration }}' \
            -destination 'generic/platform=${{ matrix.platform }}' \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | xcpretty

      - name: Linker diagnostics
        if: failure()
        working-directory: example/ios
        run: |
          grep -n -A40 "Undefined symbols" xcodebuild.log | head -120 || true
          grep -n "^Ld .*MunimLocationExample" -A3 xcodebuild.log | cut -c1-6000 | head -12 || true
          grep -h "OTHER_LDFLAGS\|FRAMEWORK_SEARCH_PATHS" "Pods/Target Support Files/Pods-MunimLocationExample/"*.xcconfig || true
          cat Pods/ReactNativeDependencies/.last_build_configuration 2>/dev/null || true
          grep -n "RNDeps\|Replac" xcodebuild.log | head -20 || true
