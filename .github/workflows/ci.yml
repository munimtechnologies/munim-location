name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Nitrogen output is committed
        run: |
          npx nitrogen
          node scripts/patch-nitro-optionals.js
          node post-script.js
          git add --intent-to-add nitrogen
          git diff --exit-code -- nitrogen

      - name: Typecheck (library)
        run: npm run typecheck

      - name: Typecheck (example)
        run: npm run typecheck:example

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (bob)
        run: npx bob build

      - name: Expo config plugin loads
        run: node -e "const plugin = require('./app.plugin.js'); if (typeof plugin !== 'function') process.exit(1)"

      - name: Pack
        run: npm pack --dry-run
